name: Signed release candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  macos:
    needs: quality
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: pnpm package:mac:release
      - name: Verify signed and stapled artifacts
        run: |
          for app in release/mac*/邻渡.app; do
            pnpm verify:mac:release -- "$app"
          done
          for dmg in release/Lindu-*.dmg; do
            xcrun stapler validate "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            release/Lindu-*.dmg
            release/Lindu-*.dmg.blockmap
            release/Lindu-*.zip
            release/Lindu-*.zip.blockmap
            release/latest-mac.yml

  windows:
    needs: quality
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      WIN_CSC_NAME: ${{ secrets.WIN_CSC_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win:release
      - name: Verify Authenticode signatures
        run: pnpm verify:win:release -- release/win-unpacked/Lindu.exe (Get-ChildItem 'release/Lindu-Setup-*.exe').FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/Lindu-Setup-*.exe
            release/Lindu-Setup-*.exe.blockmap
            release/latest.yml

  draft-release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Create release audit manifest
        run: |
          mkdir release-audit
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" node scripts/create-release-manifest.mjs release-input release-audit
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "邻渡 $GITHUB_REF_NAME" \
            release-input/**/* \
            release-audit/release-manifest.json \
            release-audit/SHA256SUMS
