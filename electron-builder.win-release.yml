extends: ./electron-builder.yml

win:
  forceCodeSigning: true
  certificateSubjectName: ${env.WIN_CSC_NAME}
  publisherName:
    - ${env.WIN_CSC_NAME}
  signingHashAlgorithms:
    - sha256
  rfc3161TimeStampServer: http://timestamp.digicert.com

publish:
  provider: github
  owner: caizhiling3-blip
  repo: lan-transfer
  releaseType: release
