appId: com.lindu.transfer
productName: 邻渡
copyright: Copyright © 2026 邻渡

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: Lindu
  artifactName: Lindu-Setup-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 邻渡
  uninstallDisplayName: 邻渡
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - zh_CN
    - en_US

publish: null
